services:
  # PostgreSQL Database (Development)
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: music-api-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - music-api-network-dev
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: music-api-app-dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/music_db?schema=public
      NODE_ENV: development
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      # ====================================
      # IMPORTANT: These volumes enable hot reload
      # ====================================
      - ./src:/app/src
      - ./prisma:/app/prisma

      # Mount config files
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./nest-cli.json:/app/nest-cli.json

      # Exclude node_modules (use container's version)
      # This is important for performance!
      - /app/node_modules

      # Exclude dist (compiled files stay in container)
      - /app/dist
    networks:
      - music-api-network-dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

networks:
  music-api-network-dev:
    driver: bridge
    name: music-api-network-dev

volumes:
  postgres_data_dev:
    name: music-api-postgres-data-dev
