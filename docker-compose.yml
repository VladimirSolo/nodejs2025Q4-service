services:
  # PostgreSQL Database
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: home-library-service-api-postgres:latest
    container_name: home-library-service-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: music_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - home-library-service
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d music_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Migrations service
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: home-library-service-api-app:latest
    container_name: home-library-service-migrations
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/music_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - home-library-service
    command: sh -c "npx prisma migrate deploy"
    restart: on-failure:5

  # NestJS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: home-library-service-api-app:latest
    container_name: home-library-service-api-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/music_db?schema=public
      NODE_ENV: production
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - home-library-service
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:4000',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: node dist/main

# Custom network for container communication
networks:
  home-library-service:
    driver: bridge
    name: home-library-service

# Persistent volume for PostgreSQL data
volumes:
  postgres_data:
    name: home-library-service-api-postgres-data
